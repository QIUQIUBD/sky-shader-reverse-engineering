name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (py_compile)
        run: python -m py_compile scripts/python/*.py
      - name: Import check (stdlib only tools)
        run: python scripts/python/spirv_info.py --help >/dev/null 2>&1 || python -c "import ast,sys; [ast.parse(open(f).read()) for f in __import__('glob').glob('scripts/python/*.py')]"
